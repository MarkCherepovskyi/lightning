# The plugin's unit tests (SPEC 7). Its own rootdir, so the repository's
# top-level conftest.py is not loaded; the trackflaky plugin (CI reporting,
# which runs git) is off:
#   .venv/bin/python -m pytest contrib/evmchan/tests
[pytest]
testpaths = tests
addopts = -p no:cacheprovider -p no:trackflaky
