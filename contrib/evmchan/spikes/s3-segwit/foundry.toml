[profile.default]
src = "src"
test = "test"
out = "out"
cache_path = "cache"
libs = []
# The S2 taproot code (BtcTx, Schnorr, TaprootSighash, TaprootKeyPath) is used in place.
remappings = ["s2/=../s2-taproot/src/"]
allow_paths = ["../s2-taproot"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

[fuzz]
runs = 256
