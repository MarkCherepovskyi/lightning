# Liquid TESTNET (real network, test coins only): one elementsd and four Core
# Lightning nodes (alice, bob, carol, dave) built from this branch.
#
#   docker compose -f contrib/liquid-poc/docker-compose.testnet.yml up -d --build elementsd
#   (wait for elementsd to sync, then)
#   docker compose -f contrib/liquid-poc/docker-compose.testnet.yml up -d --build
#   LNPOC_NET=testnet contrib/liquid-poc/lnpoc.py testnet-setup
#
# Keep it separate from the regtest stack (own project name and volumes).

name: liquid-ln-testnet

x-cln: &cln
  image: liquid-ln-poc/cln
  build:
    context: ../..
    dockerfile: contrib/liquid-poc/Dockerfile
    target: cln
  depends_on:
    - elementsd
  restart: unless-stopped
  stop_grace_period: 30s
  entrypoint:
    - sh
    - -c
    - >-
      exec lightningd
      --network=liquid-testnet
      --lightning-dir=/data
      --alias=$${NODE_ALIAS}
      --bind-addr=0.0.0.0:20735
      --bitcoin-rpcconnect=elementsd
      --bitcoin-rpcport=7039
      --bitcoin-rpcuser=poc
      --bitcoin-rpcpassword=poc
      --log-level=debug
      --developer
      --dev-fast-gossip

services:
  elementsd:
    image: liquid-ln-poc/elementsd
    build:
      context: ../..
      dockerfile: contrib/liquid-poc/Dockerfile
      target: elementsd
    command:
      - -chain=liquidtestnet
      - -datadir=/data
      - -printtoconsole
      - -server=1
      - -txindex=1
      - -validatepegin=0
      - -fallbackfee=0.00001
      - -rpcuser=poc
      - -rpcpassword=poc
      - -rpcport=7039
      - -rpcbind=0.0.0.0
      - -rpcallowip=0.0.0.0/0
      - -dbcache=1024
    volumes:
      - elements-data:/data
    restart: unless-stopped

  alice:
    <<: *cln
    environment:
      NODE_ALIAS: alice
    volumes:
      - alice-data:/data

  bob:
    <<: *cln
    environment:
      NODE_ALIAS: bob
    volumes:
      - bob-data:/data

  carol:
    <<: *cln
    environment:
      NODE_ALIAS: carol
    volumes:
      - carol-data:/data

  dave:
    <<: *cln
    environment:
      NODE_ALIAS: dave
    volumes:
      - dave-data:/data

volumes:
  elements-data:
  alice-data:
  bob-data:
  carol-data:
  dave-data:
